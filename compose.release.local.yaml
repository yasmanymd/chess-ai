services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: chess_ai_release_probe
      POSTGRES_USER: chess_ai
      POSTGRES_PASSWORD: local-release-probe-only
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      target: server-runtime
    command: pnpm --filter @chess-ai/server migration:up
    environment:
      DATABASE_URL: postgresql://chess_ai:local-release-probe-only@postgres:5432/chess_ai_release_probe
    depends_on:
      postgres:
        condition: service_healthy

  server:
    build:
      context: .
      target: server-runtime
    environment:
      DATABASE_URL: postgresql://chess_ai:local-release-probe-only@postgres:5432/chess_ai_release_probe
      NODE_ENV: production
      SERVER_PORT: 3000
      LOG_LEVEL: info
      WEB_ORIGINS: http://localhost:8080
      SESSION_COOKIE_SECURE: 'false'
      TRUST_PROXY: 'true'
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12

  web:
    build:
      context: .
      target: web-runtime
      args:
        VITE_API_URL: /api
    environment:
      PORT: 5173
    depends_on:
      server:
        condition: service_healthy

  caddy:
    image: caddy:2.10.2-alpine
    depends_on:
      web:
        condition: service_started
    ports:
      - '8080:8080'
    volumes:
      - ./deploy/Caddyfile.local:/etc/caddy/Caddyfile:ro
