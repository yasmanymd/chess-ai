services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chess_ai}
      POSTGRES_USER: ${POSTGRES_USER:-chess_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-for-local-use}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

  migrate:
    build:
      context: .
      target: development
    command: pnpm --filter @chess-ai/server migration:up
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-chess_ai}:${POSTGRES_PASSWORD:-change-me-for-local-use}@postgres:5432/${POSTGRES_DB:-chess_ai}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/server/src:/workspace/apps/server/src

  server:
    build:
      context: .
      target: development
    command: pnpm --filter @chess-ai/server dev
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-chess_ai}:${POSTGRES_PASSWORD:-change-me-for-local-use}@postgres:5432/${POSTGRES_DB:-chess_ai}
      SERVER_PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "3000:3000"
    volumes:
      - ./apps/server/src:/workspace/apps/server/src

  web:
    build:
      context: .
      target: development
    command: pnpm --filter @chess-ai/web dev
    environment:
      SERVER_PORT: 5173
      VITE_API_URL: http://localhost:3000
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web/app:/workspace/apps/web/app

volumes:
  postgres-data:
