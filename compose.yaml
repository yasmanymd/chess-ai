services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chess_ai}
      POSTGRES_USER: ${POSTGRES_USER:-chess_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-for-local-use}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql

  migrate:
    build:
      context: .
      target: development
    command: pnpm --filter @chess-ai/server migration:up
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-chess_ai}:${POSTGRES_PASSWORD:-change-me-for-local-use}@postgres:5432/${POSTGRES_DB:-chess_ai}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/server/src:/workspace/apps/server/src

  server:
    build:
      context: .
      target: development
    command: pnpm --filter @chess-ai/server dev
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-chess_ai}:${POSTGRES_PASSWORD:-change-me-for-local-use}@postgres:5432/${POSTGRES_DB:-chess_ai}
      SERVER_PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      WEB_ORIGINS: ${WEB_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://192.168.0.12:5173}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - '3000:3000'
    volumes:
      - ./apps/server/src:/workspace/apps/server/src

  web:
    build:
      context: .
      target: development
    command: pnpm --filter @chess-ai/web dev
    environment:
      SERVER_PORT: 5173
      VITE_API_URL: http://localhost:3000
    ports:
      - '5173:5173'
    volumes:
      - ./apps/web/app:/workspace/apps/web/app

  integration:
    profiles: ['quality']
    user: root
    build:
      context: .
      target: development
    command: pnpm --filter @chess-ai/server test:integration
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock
      TESTCONTAINERS_RYUK_DISABLED: 'true'
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
    volumes:
      - ./apps/server/src:/workspace/apps/server/src
      - /var/run/docker.sock:/var/run/docker.sock

  e2e:
    profiles: ['quality']
    build:
      context: .
      target: e2e
    command: sh -c "sleep 2 && pnpm --filter @chess-ai/web test:e2e"
    environment:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    depends_on:
      web:
        condition: service_started

volumes:
  postgres-data:
