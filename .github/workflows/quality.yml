name: Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-quality:
    name: Static quality and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.16.0
      - run: npm install --global pnpm@11.22.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm architecture
      - run: pnpm test

  integration:
    name: PostgreSQL integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.16.0
      - run: npm install --global pnpm@11.22.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration

  browser:
    name: Browser accessibility check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker compose --profile quality build e2e
      - run: docker compose up --build --detach postgres migrate server web
      - run: docker compose --profile quality run --rm e2e
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes --remove-orphans

  release-build:
    name: Reproducible release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build --target release-build --tag chess-ai-release-build:ci .
